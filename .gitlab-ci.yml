# Natlas CI/CD (GitLab free tier + gtlbrunner on your server)
#
#   every push / merge request (GitLab shared runners, ~1 min)
#     test       gofmt, go vet, go test
#     versions   VERSION is X.Y.Z and CHANGELOG.md has its section
#     public     no secret or private file is tracked (scripts/check-public.sh)
#   a protected tag vX.Y.Z
#     release-files  signed APK, built by gtlbrunner (tag natlas-app) inside natlas-builder;
#                    uploaded to the package registry (uses no CI minutes)
#     release        a GitLab release with the CHANGELOG section and permanent links:
#                    …/-/releases/permalink/latest/downloads/natlas.apk
#
# Release: sh scripts/release.sh "vX.Y.Z what changed"   ·   Runner: gtlbrunner (README → Releases)

stages: [check, build, release]

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH

variables:
  GOFLAGS: -mod=vendor
  PKG_URL: ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/natlas/${CI_COMMIT_TAG}

.tag-only: &tag-only
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

# ── check (shared runners) ─────────────────────────────────────────────────
test:
  stage: check
  image: golang:1.24-alpine
  needs: []
  script:
    - unformatted=$(gofmt -l cmd internal web plugins examples)
    - '[ -z "$unformatted" ] || { echo "gofmt needed: $unformatted"; exit 1; }'
    - go vet ./...
    - go test ./...

versions:
  stage: check
  image: alpine:3.20
  needs: []
  script:
    - sh scripts/check-version.sh "${CI_COMMIT_TAG:-}"

public:
  stage: check
  image: alpine:3.20
  needs: []
  before_script:
    - apk add --no-cache git >/dev/null
  script:
    - sh scripts/check-public.sh

# ── build (gtlbrunner) ─────────────────────────────────────────────────────
# Runs inside natlas-builder on gtlbrunner's Docker executor. gtlbrunner mounts the build
# cache at /build-cache and keys/natlas at /keys (read-only); nothing else on the host.
release-files:
  stage: build
  <<: *tag-only
  tags: [natlas-app]                # gtlbrunner: ./build.sh -gitlab natlas glrt-…
  image: natlas-builder:1           # = apps/natlas/compose.yml in gtlbrunner; bump with docker/builder/
  needs: [test, versions, public]
  variables:
    BUILD_CACHE: /build-cache
    KEY_DIR: /keys
  script:
    - bash scripts/build-in-container.sh ci
    - sh scripts/upload-release.sh
  artifacts:
    expire_in: 30 days
    paths: [dist/release/, release-notes.md]

# ── release (shared runner) ────────────────────────────────────────────────
release:
  stage: release
  <<: *tag-only
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs: [release-files]
  script:
    - echo "Releasing $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: Natlas $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: Android (natlas.apk)
          url: ${PKG_URL}/natlas-${CI_COMMIT_TAG}.apk
          direct_asset_path: /natlas.apk
          link_type: package
        - name: SHA256SUMS
          url: ${PKG_URL}/SHA256SUMS
          link_type: other
